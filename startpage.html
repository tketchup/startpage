// Kreis mit Anfangsbuchstabe als Ersatz für ein fehlendes Bild
function initialAvatar(text) {
  const circle = document.createElement('div');
  circle.className = 'avatar initial';
  circle.textContent = (text || '').trim().charAt(0) || '?';
  return circle;
}

// Rundes Bild. Lädt es nicht (offline oder Fehler), erscheint der Anfangsbuchstabe.
// favicon = true: kleines Website-Symbol, wird mit Rand statt formatfüllend gezeigt.
function avatar(src, letterSource, favicon = false) {
  if (!src) return initialAvatar(letterSource);
  const img = document.createElement('img');
  img.className = favicon ? 'avatar favicon' : 'avatar';
  img.alt = '';
  img.loading = 'lazy';
  // Listener vor dem Setzen von src, damit kein Fehler verpasst wird
  img.addEventListener('error', () => img.replaceWith(initialAvatar(letterSource)), { once: true });
  img.src = src;
  return img;
}

function tileName(text) {
  const span = document.createElement('span');
  span.className = 'icon-name';
  span.textContent = text;
  return span;
}

// Kleiner Knopf oben an einer Kachel: kind = 'del' (×) oder 'edit' (✎)
function tileAction(kind, label, onClick) {
  const button = document.createElement('button');
  button.className = 'tile-action ' + kind;
  button.type = 'button';
  button.textContent = kind === 'del' ? '×' : '✎';
  button.title = label;
  button.setAttribute('aria-label', label);
  button.addEventListener('click', onClick);
  return button;
}

// "+"-Kachel am Ende einer Reihe
function addTile(label, onClick) {
  const button = document.createElement('button');
  button.className = 'icon-tile add';
  button.type = 'button';
  button.title = label;
  const circle = document.createElement('div');
  circle.className = 'avatar plus';
  circle.textContent = '+';
  button.append(circle, tileName('Hinzufügen'));
  button.addEventListener('click', onClick);
  return button;
}


/* ============================================================
   Schnellzugriffe
   Symbol: eigenes Bild (Bild-Link oder lokale Datei), sonst
   automatisch das Website-Symbol über unavatar.io, sonst der
   Anfangsbuchstabe.
   ============================================================ */
const linksEl = document.getElementById('links');
const linkForm = document.getElementById('link-form');
const linkName = document.getElementById('link-name');
const linkUrl = document.getElementById('link-url');
const linkIconUrl = document.getElementById('link-icon-url');
const linkIconFile = document.getElementById('link-icon-file');
const linkPreview = document.getElementById('link-preview');
const linkHint = document.getElementById('link-hint');
const linkSubmit = document.getElementById('link-submit');

const LINK_HINT = 'Eigenes Bild: Bild-Link einfügen, Datei wählen oder ein Bild hierher ziehen. ' +
                  'Ohne eigenes Bild wird das Symbol der Website geladen.';

// Beim allerersten Laden die Startwerte übernehmen und speichern
let links = store.get(KEYS.links, null);
if (!Array.isArray(links)) {
  links = DEFAULT_LINKS.slice();
  store.set(KEYS.links, links);
}

// Ergänzt fehlendes "https://" und prüft, ob eine gültige URL entsteht
function normalizeUrl(input) {
  let url = input.trim();
  if (!url) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = 'https://' + url;
  try {
    return new URL(url).href;
  } catch {
    return null;
  }
}

// Automatisches Website-Symbol (nur für http/https-Adressen)
function autoIconUrl(url) {
  try {
    const { protocol, hostname } = new URL(url);
    if (!/^https?:$/.test(protocol) || !hostname) return null;
    return 'https://unavatar.io/' + hostname.replace(/^www\./, '') + '?fallback=false';
  } catch {
    return null;
  }
}

function linkAvatar(link) {
  if (link.icon) return avatar(link.icon, link.name);
  return avatar(autoIconUrl(link.url), link.name, true);
}

function saveLinks() {
  store.set(KEYS.links, links);
  renderLinks();
}

function renderLinks() {
  linksEl.replaceChildren();

  links.forEach((link, index) => {
    const wrap = document.createElement('div');
    wrap.className = 'tile-wrap';

    const a = document.createElement('a');
    a.className = 'icon-tile';
    a.href = link.url;
    a.title = link.url;
    a.append(linkAvatar(link), tileName(link.name));

    wrap.append(
      a,
      tileAction('edit', `${link.name} bearbeiten`, () => openLinkForm(index)),
      tileAction('del', `${link.name} entfernen`, () => {
        if (editIndex === index) closeLinkForm();
        links.splice(index, 1);
        saveLinks();
      }),
    );
    linksEl.appendChild(wrap);
  });

  // "+" öffnet das leere Formular bzw. schließt es wieder
  linksEl.appendChild(addTile('Link hinzufügen', () => {
    if (!linkForm.hidden && editIndex === null) closeLinkForm();
    else openLinkForm(null);
  }));
}

/* ---------- Formular: Link hinzufügen oder bearbeiten ---------- */
let editIndex = null;    // null = neuer Link, sonst Index des bearbeiteten Links
let pendingIcon = '';    // eigenes Bild (URL oder data:-URL); leer = automatisch

function openLinkForm(index) {
  editIndex = index;
  const link = index === null ? { name: '', url: '' } : links[index];
  linkName.value = link.name;
  linkUrl.value = link.url;
  pendingIcon = link.icon || '';
  linkIconUrl.value = pendingIcon.startsWith('data:') ? '' : pendingIcon;
  linkIconUrl.placeholder = pendingIcon.startsWith('data:') ? 'Eigenes Bild (Datei)' : 'Bild-URL (optional)';
  linkIconFile.value = '';
  linkHint.textContent = LINK_HINT;
  linkSubmit.textContent = index === null ? 'Hinzufügen' : 'Speichern';
  linkForm.hidden = false;
  updatePreview();
  linkName.focus();
}

function closeLinkForm() {
  linkForm.hidden = true;
  linkForm.reset();
  editIndex = null;
  pendingIcon = '';
}

// Vorschau des Symbols im Formular
function updatePreview() {
  const url = normalizeUrl(linkUrl.value);
  const label = linkName.value || linkUrl.value;
  linkPreview.replaceChildren(pendingIcon
    ? avatar(pendingIcon, label)
    : avatar(url && autoIconUrl(url), label, true));
}

function setPendingIcon(icon, message = LINK_HINT) {
  pendingIcon = icon;
  linkIconUrl.placeholder = icon.startsWith('data:') ? 'Eigenes Bild (Datei)' : 'Bild-URL (optional)';
  linkHint.textContent = message;
  updatePreview();
}

// Bild-Link aus dem Textfeld übernehmen
function applyIconUrl() {
  const value = linkIconUrl.value.trim();
  if (!value) {
    if (!pendingIcon.startsWith('data:')) setPendingIcon('');
    return;
  }
  const url = normalizeUrl(value);
  if (url) setPendingIcon(url);
  else linkHint.textContent = 'Das ist keine gültige Bild-URL.';
}

// Lokales Bild auf 128 × 128 px zuschneiden und als data:-URL speichern
// (klein genug für localStorage, funktioniert auch offline)
function imageFileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.addEventListener('load', () => {
      const size = 128;
      const width = img.naturalWidth || size;
      const height = img.naturalHeight || size;
      const scale = Math.max(size / width, size / height);   // formatfüllend, mittig
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      canvas.getContext('2d').drawImage(
        img, (size - width * scale) / 2, (size - height * scale) / 2, width * scale, height * scale);
      URL.revokeObjectURL(objectUrl);
      resolve(canvas.toDataURL('image/webp', 0.9));
    });
    img.addEventListener('error', () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error('Datei ist kein lesbares Bild'));
    });
    img.src = objectUrl;
  });
}

async function useImageFile(file) {
  if (!file) return;
  try {
    const dataUrl = await imageFileToDataUrl(file);
    linkIconUrl.value = '';
    setPendingIcon(dataUrl, `Eigenes Bild: ${file.name}`);
  } catch {
    linkHint.textContent = 'Diese Datei konnte nicht als Bild gelesen werden.';
  }
}

linkUrl.addEventListener('change', updatePreview);
// Beim Tippen des Namens nur den Anfangsbuchstaben der Vorschau anpassen
linkName.addEventListener('input', () => {
  const initial = linkPreview.querySelector('.initial');
  if (initial) initial.textContent = (linkName.value || linkUrl.value).trim().charAt(0) || '?';
});
linkIconUrl.addEventListener('change', applyIconUrl);

document.getElementById('link-icon-pick').addEventListener('click', () => linkIconFile.click());
linkIconFile.addEventListener('change', () => useImageFile(linkIconFile.files[0]));
document.getElementById('link-icon-clear').addEventListener('click', () => {
  linkIconUrl.value = '';
  setPendingIcon('');
});

// Bild per Drag & Drop: Datei vom PC oder Bild aus einem anderen Browserfenster
linkForm.addEventListener('dragover', (event) => {
  event.preventDefault();
  linkForm.classList.add('dragover');
});
linkForm.addEventListener('dragleave', (event) => {
  if (!linkForm.contains(event.relatedTarget)) linkForm.classList.remove('dragover');
});
linkForm.addEventListener('drop', (event) => {
  event.preventDefault();
  linkForm.classList.remove('dragover');
  const file = [...event.dataTransfer.files].find((f) => f.type.startsWith('image/'));
  if (file) {
    useImageFile(file);
    return;
  }
  const dropped = (event.dataTransfer.getData('text/uri-list') || event.dataTransfer.getData('text/plain'))
    .split('\n').map((line) => line.trim()).find((line) => /^https?:\/\//i.test(line));
  if (dropped) {
    linkIconUrl.value = dropped;
    applyIconUrl();
  }
});

linkForm.addEventListener('submit', (event) => {
  event.preventDefault();
  applyIconUrl();   // falls der Bild-Link noch nicht übernommen wurde (Enter)
  const url = normalizeUrl(linkUrl.value);
  if (!url) {
    linkUrl.focus();
    return;
  }
  // Ohne Namen wird der Hostname verwendet
  const name = linkName.value.trim() || new URL(url).hostname.replace(/^www\./, '') || url;
  const entry = { name, url };
  if (pendingIcon) entry.icon = pendingIcon;

  if (editIndex === null) links.push(entry);
  else links[editIndex] = entry;
  closeLinkForm();
  saveLinks();
});

document.getElementById('link-cancel').addEventListener('click', closeLinkForm);
linkForm.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeLinkForm();
});

renderLinks();

// Kanalname aus "name", "@name" oder einem twitch.tv-Link lesen
function parseChannel(input) {
  const value = input.trim();
  const match = value.match(/twitch\.tv\/([a-z0-9_]{2,25})/i) || value.match(/^@?([a-z0-9_]{2,25})$/i);
  return match ? match[1].toLowerCase() : null;
}

function renderChannels() {
  twitchEl.replaceChildren();

  channels.forEach((channel, index) => {
    const wrap = document.createElement('div');
    wrap.className = 'tile-wrap';

    const a = document.createElement('a');
    a.className = 'icon-tile';
    a.href = 'https://www.twitch.tv/' + encodeURIComponent(channel);
    a.title = channel;
    // fallback=false: unavatar liefert dann einen Fehler statt eines Platzhalterbilds
    a.append(
      avatar('https://unavatar.io/twitch/' + encodeURIComponent(channel) + '?fallback=false', channel),
      tileName(channel));

    wrap.append(a, tileAction('del', `${channel} entfernen`, () => {
      channels.splice(index, 1);
      store.set(KEYS.channels, channels);
      renderChannels();
    }));
    twitchEl.appendChild(wrap);
  });

  twitchEl.appendChild(addTile('Twitch-Kanal hinzufügen', () => toggleChannelForm()));
}

function toggleChannelForm(open) {
  const show = typeof open === 'boolean' ? open : channelForm.hidden;
  channelForm.hidden = !show;
  channelHint.hidden = true;
  if (show) channelInput.focus();
  else channelForm.reset();
}

channelForm.addEventListener('submit', (event) => {
  event.preventDefault();
  const channel = parseChannel(channelInput.value);
  if (!channel) {
    channelHint.textContent = 'Bitte einen Kanalnamen (2–25 Zeichen: Buchstaben, Ziffern, _) oder einen twitch.tv-Link eingeben.';
    channelHint.hidden = false;
    channelInput.focus();
    return;
  }
  if (!channels.includes(channel)) {
    channels.push(channel);
    store.set(KEYS.channels, channels);
    renderChannels();
  }
  toggleChannelForm(false);
});

document.getElementById('channel-cancel').addEventListener('click', () => toggleChannelForm(false));
channelForm.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') toggleChannelForm(false);
});

/* ============================================================
   Lesezeichenleiste
   Chromium zeigt die eigene Leiste ("Nur auf neuem Tab anzeigen")
   nicht auf Erweiterungs-Seiten an. Deshalb liest die Erweiterung
   die Lesezeichen über chrome.bookmarks und zeigt sie hier an.
   Als file:// gibt es diese API nicht; die Leiste bleibt dann aus.
   ============================================================ */
const hasBookmarksApi = typeof chrome !== 'undefined' && chrome.bookmarks;

if (hasBookmarksApi) {
  const barEl = document.getElementById('bookmarks');
  let menuEl = null;       // aktuell geöffnetes Ordner-Menü
  let menuButton = null;   // Ordner-Knopf, zu dem das Menü gehört

  const FOLDER_SVG =
    '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    '<path d="M1.5 3A1.5 1.5 0 0 1 3 1.5h3.4l1.6 2h5A1.5 1.5 0 0 1 14.5 5v7.5A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5z"/></svg>';

  // Favicon aus dem Browser-Cache (keine Netzwerkanfrage)
  function faviconUrl(pageUrl) {
    return chrome.runtime.getURL('/_favicon/') +
      '?pageUrl=' + encodeURIComponent(pageUrl) + '&size=32';
  }

  function folderIcon() {
    const span = document.createElement('span');
    span.className = 'bm-icon folder';
    span.innerHTML = FOLDER_SVG;   // fester String, keine Nutzerdaten
    return span;
  }

  function label(text) {
    const span = document.createElement('span');
    span.className = 'bm-label';
    span.textContent = text;
    return span;
  }

  // Ein einzelnes Lesezeichen (Link) oder einen Ordner (Knopf) bauen
  function bookmarkNode(node, inMenu) {
    if (node.url) {
      // Bookmarklets laufen auf Erweiterungs-Seiten nicht
      if (node.url.startsWith('javascript:')) return null;

      const a = document.createElement('a');
      a.className = 'bm';
      a.href = node.url;
      a.title = node.title ? `${node.title}\n${node.url}` : node.url;

      const icon = document.createElement('img');
      icon.className = 'bm-icon';
      icon.alt = '';
      icon.src = faviconUrl(node.url);
      a.append(icon);
      if (node.title || inMenu) a.append(label(node.title || node.url));

      // chrome://-Seiten u. ä. lassen sich nicht per normalem Link öffnen
      if (!/^(https?|file|ftp):/i.test(node.url)) {
        a.addEventListener('click', (event) => {
          if (event.ctrlKey || event.metaKey || event.button !== 0) return;
          event.preventDefault();
          chrome.tabs.update({ url: node.url });
        });
      }
      return a;
    }

    const button = document.createElement('button');
    button.className = 'bm';
    button.type = 'button';
    button.title = node.title;
    button.append(folderIcon(), label(node.title));
    button.addEventListener('click', (event) => {
      event.stopPropagation();
      if (inMenu) {
        // Unterordner: Menü-Inhalt durch den Unterordner ersetzen
        fillMenu(node.id);
      } else if (menuButton === button) {
        closeMenu();
      } else {
        openMenu(node.id, button);
      }
    });
    return button;
  }

  // Ordner-Menü unter einem Knopf der Leiste öffnen
  function openMenu(folderId, button) {
    closeMenu();
    menuButton = button;
    button.classList.add('open');
    menuEl = document.createElement('div');
    menuEl.className = 'bm-menu';
    menuEl.addEventListener('click', (event) => event.stopPropagation());
    document.body.appendChild(menuEl);

    const rect = button.getBoundingClientRect();
    menuEl.style.top = `${rect.bottom + 4}px`;
    menuEl.style.left = `${Math.max(8, Math.min(rect.left, innerWidth - 228))}px`;
    fillMenu(folderId);
  }

  // Menü mit dem Inhalt eines Ordners füllen. menuPath merkt sich die
  // geöffneten Ordner, damit "Zurück" aus Unterordnern herausführt.
  let menuPath = [];

  function fillMenu(folderId) {
    menuPath.push(folderId);
    renderMenu();
  }

  async function renderMenu() {
    if (!menuEl) return;
    const children = await chrome.bookmarks.getChildren(menuPath.at(-1));
    menuEl.replaceChildren();

    if (menuPath.length > 1) {
      const back = document.createElement('button');
      back.className = 'bm';
      back.type = 'button';
      back.append(label('‹ Zurück'));
      back.addEventListener('click', () => {
        menuPath.pop();
        renderMenu();
      });
      menuEl.appendChild(back);
    }

    const nodes = children.map((child) => bookmarkNode(child, true)).filter(Boolean);
    if (nodes.length) {
      menuEl.append(...nodes);
    } else {
      const empty = document.createElement('div');
      empty.className = 'bm-empty';
      empty.textContent = '(leer)';
      menuEl.appendChild(empty);
    }
  }

  function closeMenu() {
    menuEl?.remove();
    menuButton?.classList.remove('open');
    menuEl = null;
    menuButton = null;
    menuPath = [];
  }

  document.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMenu();
  });

  // Leiste aufbauen: Inhalt der Lesezeichenleiste, rechts "Weitere Lesezeichen"
  async function renderBookmarks() {
    closeMenu();
    const [root] = await chrome.bookmarks.getTree();
    const [bar, other] = root.children;   // 0 = Lesezeichenleiste, 1 = Weitere

    barEl.replaceChildren();
    for (const child of bar.children ?? []) {
      const node = bookmarkNode(child, false);
      if (node) barEl.appendChild(node);
    }
    if (other?.children?.length) {
      const spacer = document.createElement('span');
      spacer.className = 'bm-spacer';
      barEl.append(spacer, bookmarkNode(other, false));
    }
    barEl.hidden = barEl.childElementCount === 0;
    // Das Apps-Menü rückt unter die Leiste, solange sie sichtbar ist
    document.body.classList.toggle('has-bookmarks', !barEl.hidden);
  }

  renderBookmarks();

  // Änderungen an den Lesezeichen sofort übernehmen
  for (const event of ['onCreated', 'onRemoved', 'onChanged', 'onMoved', 'onChildrenReordered']) {
    chrome.bookmarks[event].addListener(renderBookmarks);
  }
}
</script>
</body>
